name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle Java toolchains
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.java.installations.auto-download=false"
            echo "org.gradle.java.installations.auto-detect=false"
            echo "org.gradle.java.installations.paths=${JAVA_HOME}"
          } >> ~/.gradle/gradle.properties

      - name: Warm Gradle
        run: ./gradlew :app:compileFullDebugKotlin --no-daemon
